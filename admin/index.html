<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="robots" content="noindex, nofollow, noarchive"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/><meta name="theme-color" content="#0A1F22"/><title>Lumière — Clinic Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><script>
  // Prevent iOS pinch zoom gestures
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, { passive: false });
  // Prevent multi-touch pinch zoom
  document.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });
</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
